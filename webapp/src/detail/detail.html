<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./detail.scss" />
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <title>Merto</title>
  </head>
  <body>
    <header class="main-container-wrapper">
      <div class="main-container">
        <div class="header-container"></div>
        <nav>
          <ul id="cat-list"></ul>
        </nav>
      </div>
    </header>
    <main>
      <section>
        <div class="container">
          <div class="images">
            <div class="thumbnails" id="thumbnails"></div>
            <div class="mainImg" id="mainImg"></div>
          </div>
          <div class="productInfo">
            <div class="info">
              <p id="subCategoryName"></p>
              <h1 id="name"></h1>
              <div class="reviews">
                <div class="stars">
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star-half-stroke"></i>
                </div>
                <p>(342 Reviews)</p>
                <a href="#scrollTo">See Reviews</a>
              </div>
              <div class="price">
                <div class="new" id="price"></div>
                <div class="old" id="previousPrice"></div>
              </div>
              <div class="stock" id="storageQuantity">
                <p>In Stock</p>
              </div>
            </div>
            <div class="productColors">
              <p id="colorName"></p>
              <div class="colors" id="colors"></div>
            </div>
            <div class="productMemory">
              <p id="memoryName"></p>
              <div class="memories" id="memories"></div>
            </div>
            <div class="cart-wish">
              <div class="addToCart">
                <div class="toCart">
                  <button>ADD TO CART</button>
                </div>
              </div>
              <div class="wishList">
                <i class="fa-regular fa-heart"></i> /<i class="fa-solid fa-heart"></i>
                <p>Add To Wishlist</p>
              </div>
            </div>
            <div class="addInfo">
              <p>SKU: <span id="barCode"></span></p>
              <p>Categories: <span id="categoryName"></span></p>
              <div class="social">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-pinterest-p"></i>
                <i class="fa-brands fa-x-twitter"></i>
                <i class="fa-brands fa-linkedin"></i>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section>
        <div class="container">
          <div class="about">
            <div class="head">
              <h2 id="specifications">Specifications</h2>
              <h2 id="reviews">Reviews</h2>
            </div>
            <div class="content" id="scrollTo">
              <div class="specifications" id="specificationsMenu"></div>
              <div class="reviews" id="reviewsMenu">
                <h1>Reviews</h1>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="portal">
      <div class="login-popup-content">
        <div class="banner-content">
          <img src="https://merto-be87.kxcdn.com/merto/wp-content/uploads/2024/05/login-banner.jpg" loading="lazy" alt="Banner" />
        </div>
        <div class="form-content">
          <h4 class="form-title">Login</h4>
          <form class="form-login" name="ts-login-form" id="ts-login-form">
            <p class="login-email">
              <label for="user_login"></label>
              <input
                type="email"
                name="log"
                id="user_login"
                autocomplete="email"
                class="input enter-email"
                value=""
                size="20"
                placeholder="Email address*"
                required
              />
            </p>
            <p class="login-password">
              <label for="user_pass"></label>
              <input
                type="password"
                name="pwd"
                id="user_pass"
                autocomplete="current-password"
                spellcheck="false"
                class="input enter-pass"
                value=""
                size="20"
                placeholder="Password*"
                required
              />
            </p>
            <div class="div">
              <p class="login-forget-password">
                <span class="frgt" class="forget-password">Forget Password?</span>
              </p>
            </div>
            <p class="login-submit">
              <button class="login-submitt">Log in</button>
            </p>
          </form>
          <form class="form-reg" name="ts-reg-form" id="ts-reg-form">
            <p class="login-displayname">
              <label for="user_username"></label>
              <input
                type="text"
                name="log"
                id="user_displayname"
                autocomplete="username"
                class="input enter-email"
                value=""
                size="20"
                placeholder="Username*"
                required
                minlength="3"
              />
            </p>
            <p class="login-email">
              <label for="user_email"></label>
              <input
                type="email"
                name="log"
                id="user_register"
                autocomplete="username"
                class="input enter-email"
                value=""
                size="20"
                placeholder="Email address*"
                required
              />
            </p>
            <p class="login-password">
              <label for="user_pass"></label>
              <input
                type="password"
                name="pwd"
                id="user_pass_register"
                autocomplete="current-password"
                spellcheck="false"
                class="input enter-pass"
                value=""
                size="20"
                placeholder="Password*"
                required
                minlength="6"
              />
            </p>
            <p class="login-submit">
              <button class="login-submitt">Registrataion</button>
            </p>
          </form>
          <div class="create-account-wrapper">
            <span class="form-btm">Already have an account?</span>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer-container"></div>
    </footer>

    <script async type="module" src="./detail.js"></script>
  </body>
</html>
